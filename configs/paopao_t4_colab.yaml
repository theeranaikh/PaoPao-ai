# Google Colab NVIDIA T4 configuration. Requires the Drive paths from docs/TRAINING.md.
tokenizer_path: /content/drive/MyDrive/paopao/artifacts/tokenizer

model:
  vocab_size: 32000
  hidden_size: 512
  num_layers: 12
  num_heads: 8
  intermediate_size: 2048
  max_seq_len: 512
  dropout: 0.1
  gradient_checkpointing: true

data:
  train_path: /content/drive/MyDrive/paopao/data/processed/train.pt
  validation_path: /content/drive/MyDrive/paopao/data/processed/validation.pt

training:
  output_dir: /content/drive/MyDrive/paopao/checkpoints/paopao_t4
  epochs: 3
  batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0003
  weight_decay: 0.1
  warmup_steps: 500
  min_lr_scale: 0.1
  max_grad_norm: 1.0
  mixed_precision: true
  num_workers: 0
  log_every: 10
  validate_every: 200
  save_every: 200
  seed: 42
  device: cuda

