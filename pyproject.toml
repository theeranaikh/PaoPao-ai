[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paopao"
version = "0.1.0"
description = "A from-scratch PyTorch code language model and coding agent"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
  "torch>=2.1.0",
  "numpy>=1.26.0",
  "tokenizers>=0.15.0",
  "PyYAML>=6.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
paopao = "cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.setuptools]
packages = ["agent", "cli", "data", "evaluation", "inference", "model", "tokenizer", "tools", "training"]
